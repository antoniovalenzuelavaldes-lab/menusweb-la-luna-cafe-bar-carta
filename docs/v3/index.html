let VARIANTE="rejilla"; const DIN=false, GC="", FOTOS="../fotos/", API="https://menusweb-api.antonio-valenzuela-valdes.workers.dev", RID="la-luna-cafe-bar-carta";
const fm=f=>/^(https?:|data:)/.test(f)?f:FOTOS+"min/"+f;
function ev(n){try{if(DIN&&window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:(typeof GP==="string"?GP:"")+n,title:n,event:true})}catch(x){}}
const fu=f=>/^(https?:|data:)/.test(f)?f:FOTOS+f;
let C=null;
const R=CARTA.restaurante;
const IDI=CARTA.idiomas||["es","en","de"],NOMI={zh:"中文"};const nm=o=>(o.nom&&o.nom[L])||o.nombre;
let L=(navigator.language||"es").slice(0,2);if(!T[L]||!IDI.includes(L))L=IDI.includes("en")?"en":IDI[0];
if(/^es/.test(navigator.language||"")&&IDI.includes("es"))L="es";
let F=null;
const $=id=>document.getElementById(id);
const eur=n=>n.toFixed(2).replace(".",",")+" €";
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function tags(p){let h="";
 if(p.nuevo)h+=`<span class="tag n">${T[L].nuevo}</span>`;
 if(p.temp)h+=`<span class="tag">${T[L][{frio:"fr",caliente:"ca",ambos:"am"}[p.temp]]}</span>`;
 if(p.vegetariano)h+=`<span class="tag v">${T[L].veg}</span>`;
 if(p.picante)h+=`<span class="tag p">${T[L].pic}</span>`;
 (p.alergenos||[]).forEach(a=>h+=`<span class="tag">${T[L].al[a]||a}</span>`);return h}
function plato(p,i,j){
 const d=p.desc?`<div class="d">${esc(p.desc[L]||p.desc.es)}</div>`:"";
 const pr=p.precio==null?(p.sinprecio?"":`<span class="pr" style="color:#7a4a3a">${T[L].pend}</span>`):`<span class="pr">${eur(p.precio)}</span>`;
 const txt=`<div class="l1"><span class="n">${esc(nm(p))}</span><span class="pt"></span>${pr}</div>${d}<div>${tags(p)}</div>`;
 const im=p.foto?`<img loading="lazy" decoding="async" src="${VARIANTE==="revista"?fu(p.foto):fm(p.foto)}" alt="${esc(p.nombre)}">`:`<div class="sinfoto"></div>`;
 if(VARIANTE==="rejilla"){const pr2=p.precio==null?(p.sinprecio?"":`<span style="color:#7a4a3a">${T[L].pend}</span>`):eur(p.precio);return `<div class="plato card" data-i="${i}" data-j="${j}">${im}<div class="ct"><div class="n">${esc(nm(p))}</div><div class="pr">${pr2}</div><div>${tags(p)}</div></div></div>`}
 if(VARIANTE==="revista")return `<div class="plato rev" data-i="${i}" data-j="${j}">${im}<div class="ct">${txt}</div></div>`;
 if(VARIANTE==="fotos"||VARIANTE==="pestanas")return `<div class="plato con-foto" data-i="${i}" data-j="${j}"><div class="tx">${txt}</div>${p.foto?`<img class="thumb" loading="lazy" decoding="async" src="${fm(p.foto)}" alt="${esc(p.nombre)}">`:`<div class="thumb vacio"></div>`}</div>`;
 return `<div class="plato" data-i="${i}" data-j="${j}">${txt}</div>`}
function pinta(){
 document.documentElement.lang=L;const t=T[L];
 $("langs").innerHTML=IDI.map(l=>`<button class="${l==L?"on":""}" data-l="${l}">${NOMI[l]||l.toUpperCase()}</button>`).join("");
 $("nom").textContent=R.nombre;$("sub").textContent=R.subtitulo||"";$("pie").innerHTML=esc(R.nombre+(R.subtitulo?" · "+R.subtitulo:""))+(GC?`<br><small style="font-size:12px">${t.stat}</small>`:"")+(CARTA.credito!==false&&CARTA.sitio?`<br><a href="${CARTA.sitio}" target="_blank" rel="noopener" style="color:inherit">${t.cred}</a>`:"");document.title=R.nombre+(R.subtitulo?" · "+R.subtitulo:"");
 $("sub").style.display=R.subtitulo?"":"none";$("lema").textContent=(CARTA.textos.lema||{})[L]||"";$("frase").textContent=(CARTA.textos.frase||{})[L]||"";
 $("b-ver").textContent=t.ver;
 const hay=k=>CARTA.categorias.some(c=>c.platos.some(p=>!p.oculto&&p[k])),fl=[[null,t.pref],...(hay("vegetariano")?[["vegetariano",t.veg]]:[]),...(hay("picante")?[["picante",t.pic]]:[])];if(F&&!hay(F))F=null;
 $("filtros").style.display=fl.length>1?"":"none";
 $("filtros").innerHTML=fl.map(([k,n])=>`<button class="${F==k?"on":""}" data-f="${k}">${n}</button>`).join("");
 if(VARIANTE==="pestanas"){const vis=CARTA.categorias.filter(c=>c.platos.some(p=>!p.oculto));if(!C||!vis.some(c=>c.id===C))C=vis[0]&&vis[0].id;
 $("nav").innerHTML=vis.map(c=>`<a href="#" data-c="${c.id}" class="${c.id===C?"on":""}">${esc(nm(c))}</a>`).join("")}
 else $("nav").innerHTML=CARTA.categorias.map(c=>`<a href="#${c.id}">${esc(nm(c))}</a>`).join("");
 const dd=[];CARTA.categorias.forEach((c,i)=>c.platos.forEach((p,j)=>{if(!p.oculto&&CARTA.destacados.includes(p.nombre))dd.push([p,i,j])}));
 $("dest").innerHTML=`<h2>${(CARTA.textos.destacados||{})[L]||t.dest}</h2>`+dd.map(([p,i,j])=>`<div class="it" data-i="${i}" data-j="${j}"><span>${esc(nm(p))}</span><b>${p.precio==null?"":eur(p.precio)}</b></div>`).join("");
 $("carta").innerHTML=CARTA.categorias.map((c,i)=>{
  if(VARIANTE==="pestanas"&&c.id!==C)return"";
  const ps=c.platos.map((p,j)=>[p,j]).filter(([p])=>!p.oculto&&(!F||p[F]));
  if(!ps.length)return"";
  return `<section class="sec" id="${c.id}"><h2>${esc(nm(c))}</h2><div class="es">${c.sub[L]||c.sub.es}</div>${c.nota?`<div class="nota">${CARTA.textos[c.nota][L]}</div>`:""}${VARIANTE==="rejilla"?`<div class="grid">${ps.map(([p,j])=>plato(p,i,j)).join("")}</div>`:ps.map(([p,j])=>plato(p,i,j)).join("")}</section>`}).join("");
 if(!$("carta").innerHTML.trim())$("carta").innerHTML=`<p style="text-align:center;padding:40px 10px;opacity:.8">${t.vacio}</p>`;
 $("dest").style.display=dd.length?"":"none";
 $("aler").textContent=t.aler;
}
document.addEventListener("click",e=>{
 const cc=e.target.closest("[data-c]");if(cc){e.preventDefault();C=cc.dataset.c;pinta();scrollTo({top:document.querySelector("nav.cats").offsetTop,behavior:"smooth"});return}
 const l=e.target.closest("[data-l]");if(l){L=l.dataset.l;ev("idioma/"+L);pinta();return}
 const f=e.target.closest("[data-f]");if(f){F=f.dataset.f==="null"?null:f.dataset.f;pinta();return}
 const p=e.target.closest("[data-i]");if(p){
  const c=CARTA.categorias[p.dataset.i],d=c.platos[p.dataset.j];ev("plato/"+d.nombre);
  $("mc").innerHTML=`<h3>${esc(nm(d))}</h3><div class="es" style="font-style:italic;opacity:.7">${esc(nm(c))} · ${c.sub[L]||c.sub.es}</div>${d.foto?`<img class="foto" src="${fu(d.foto)}" alt="${esc(d.nombre)}">`:""}${d.desc?`<p>${esc(d.desc[L]||d.desc.es)}</p>`:""}<p style="font:700 20px sans-serif;color:var(--tomate)">${d.precio==null?T[L].pend:eur(d.precio)}</p><div>${tags(d)}</div><p class="aler">${T[L].aler}</p><a class="btn rojo" href="#" id="cerrar">${T[L].cerrar}</a>`;
  $("modal").style.display="flex";return}
 if(e.target.id==="modal"||e.target.id==="cerrar"){e.preventDefault();$("modal").style.display="none"}
});
$("top").onclick=()=>scrollTo({top:0});
addEventListener("scroll",()=>$("top").style.display=scrollY>600?"block":"none");
pinta();
(async()=>{if(!API)return;try{const r=await fetch(API+"/carta/"+RID);if(!r.ok)return;const d=await r.json();
 if(Array.isArray(d.categorias)){CARTA.categorias=d.categorias;if(Array.isArray(d.destacados)&&d.destacados.length)CARTA.destacados=d.destacados;
 const a=d.ajustes||{};if(a.nombre)R.nombre=a.nombre;if(typeof a.subtitulo==="string")R.subtitulo=a.subtitulo;
 if(DIN&&["lista","fotos","rejilla","pestanas","revista"].includes(a.variante))VARIANTE=a.variante;pinta()}}catch(e){}})();
